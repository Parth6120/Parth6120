name: Generate GitHub Metrics

on:
  # Run automatically every day at midnight
  schedule:
    - cron: "0 0 * * *"
  # Allow you to run the workflow manually from the Actions tab
  workflow_dispatch:
  # Run on every push to the main branch
  push:
    branches:
      - main

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push the generated SVG to your repo
    steps:
      - name: Generate Metrics SVG
        uses: lowlighter/metrics@latest
        with:
          # Your GitHub token from the repository secrets
          token: ${{ secrets.GH_TOKEN }}

          # Core configuration
          user: Parth6120
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Toronto

          # Styling
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year